<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#faf9f4"/>
  
  <!-- Breaker Enclosure -->
  <rect x="180" y="440" width="720" height="980" rx="40" fill="#ffffff" stroke="#1b2e38" stroke-width="12"/>
  <text x="540" y="530" fill="#1b2e38" font-family="Arial, sans-serif" font-weight="900" font-size="48" text-anchor="middle">CIRCUIT BREAKER</text>
  
  <!-- Magnetic Solenoid Coil -->
  <rect x="420" y="620" width="240" height="200" rx="20" fill="#e2e8f0" stroke="#1b2e38" stroke-width="8"/>
  <path d="M440 660 H640 M440 700 H640 M440 740 H640 M440 780 H640" stroke="#c86b43" stroke-width="14" stroke-linecap="round"/>
  <text x="540" y="855" fill="#1b2e38" font-family="Arial, sans-serif" font-weight="900" font-size="32" text-anchor="middle">MAGNETIC COIL</text>
  
  <!-- Breaker Contacts in OPEN position -->
  <!-- Fixed Terminal Left -->
  <circle cx="340" cy="1040" r="24" fill="#1b2e38"/>
  <line x1="220" y1="1040" x2="340" y2="1040" stroke="#c86b43" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Fixed Terminal Right -->
  <circle cx="740" cy="1040" r="24" fill="#1b2e38"/>
  <line x1="740" y1="1040" x2="860" y2="1040" stroke="#c86b43" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Moving Contact Arm (Snapped Upward) -->
  <g transform="rotate(-45 340 1040)">
    <line x1="340" y1="1040" x2="620" y2="1040" stroke="#d7584d" stroke-width="20" stroke-linecap="round"/>
    <circle cx="620" cy="1040" r="26" fill="#ffe35a" stroke="#1b2e38" stroke-width="6"/>
  </g>
  
  <!-- Large CLEAR AIR GAP callout -->
  <path d="M490 920 Q560 980 620 1040" fill="none" stroke="#ffe35a" stroke-width="8" stroke-dasharray="16 12"/>
  <rect x="440" y="890" width="240" height="70" rx="14" fill="#1b2e38"/>
  <text x="560" y="938" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="32" text-anchor="middle">OPEN GAP</text>
  
  <!-- Success Safe Status -->
  <g transform="translate(100, 1500)">
    <rect x="0" y="0" width="880" height="130" rx="26" fill="#176e4e"/>
    <text x="440" y="58" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="42" text-anchor="middle">POWER INTERRUPTED INSTANTLY</text>
    <text x="440" y="104" fill="#ffe35a" font-family="Arial, sans-serif" font-weight="800" font-size="32" text-anchor="middle">ZERO SHOCK HAZARD REMAINS</text>
  </g>
</svg>